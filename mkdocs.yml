site_name: CanSensorHub — stanowisko obsługi magistrali CAN
site_description: >-
  Modularna aplikacja PC (.NET 10 / WPF) do obsługi węzłów CAN: monitor
  magistrali, zakładki urządzeń, narzędzie bootloadera, rejestracja danych.
site_author: CanSensorHub
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: pl
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Tryb jasny

nav:
  - Start: index.md
  - Architektura: architektura.md
  - Warstwa protokołu: protokol.md
  - Narzędzie bootloadera: bootloader.md
  - Niezawodność wgrywania: BOOTLOADER_ROBUSTNESS.md
  - Dodawanie modułu urządzenia: moduly.md
  - Budowanie i uruchamianie: budowanie.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: pl
